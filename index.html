<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11191c"><title>HARU CINEMA · 입장</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#30403e,transparent 65%),#0d1418;color:#eee5d8;font:16px/1.7 system-ui,sans-serif;display:grid;place-items:center;padding:28px}main{width:min(560px,100%);border:1px solid #ffffff20;border-radius:24px;padding:48px;background:#152023e6;box-shadow:0 30px 100px #0005}.eyebrow{color:#bfaa8b;letter-spacing:.25em;font-size:11px}h1{font-size:clamp(38px,9vw,62px);line-height:1.08;letter-spacing:-.05em;margin:28px 0}p{color:#aebbb6}label{display:block;font-size:13px;margin-top:32px}input{width:100%;margin:8px 0 16px;padding:15px;border:1px solid #ffffff30;border-radius:9px;background:#ffffff08;color:inherit;font:inherit}button{width:100%;padding:16px;background:#e2cbae;color:#162125;font:700 15px system-ui;border:0;border-radius:9px;cursor:pointer}button:disabled{opacity:.4;cursor:default}small{display:block;font-size:12px;color:#98a7a1;margin-top:24px}.line{height:1px;background:#ffffff1a;margin-top:35px}#status{font-size:13px}a{color:#e2cbae}footer{display:flex;gap:20px;font-size:11px;color:#8e9f98;margin-top:28px}@media(max-width:480px){main{padding:30px}}</style></head><body><main><div class="eyebrow">A PRIVATE SCREENING CLUB</div><h1>우리의 취향이<br>모이는 밤.</h1><p>친구들과 함께, 같은 화면 앞에서.<br>루프탑과 클래식 영화관에서 만나요.</p><div id="status" role="status">접속 정보를 확인하고 있어요…</div><form id="entry"><label for="room">방 코드 <span style="color:#95a69c">· 초대받았다면 입력</span></label><input id="room" maxlength="10" pattern="[a-fA-F0-9]{10}" placeholder="입장 후에도 입력할 수 있어요" autocomplete="off"><button id="connect" disabled>영화관 입장하기 ↗</button></form><small>입장한 뒤 닉네임과 방 비밀번호를 입력하세요.<br>호스트 PC의 서버가 켜져 있을 때 이용할 수 있습니다.</small><div class="line"></div><footer><span>HARU CINEMA</span><span>최대 20명</span><span>설치 없이 브라우저로</span></footer></main><script type="module">
let target;const status=document.querySelector('#status'),button=document.querySelector('#connect'),room=document.querySelector('#room');const invited=new URLSearchParams(location.search).get('room');if(/^[a-f0-9]{10}$/i.test(invited||''))room.value=invited;
try{const response=await fetch('./server.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const config=await response.json();if(!config.url)throw Error();const url=new URL(config.url);if(url.protocol!=='https:'||url.username||url.password)throw Error();target=url.origin;status.textContent='입장 주소가 준비되어 있어요.';button.disabled=false}catch{status.textContent='지금은 서버 연결 주소가 준비되지 않았어요. 호스트에게 문의해주세요.'}
document.querySelector('#entry').onsubmit=e=>{e.preventDefault();if(!target)return;const url=new URL(target);if(room.value)url.searchParams.set('room',room.value.toLowerCase());location.assign(url.href)};
</script></body></html>
